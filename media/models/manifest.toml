# Flux.1-dev is gated: Hugging Face requires an accepted license + a
# Bearer token even to read the file's LFS metadata (the tree API masks
# `lfs.oid` with asterisks for an unauthenticated request; `raw/main/`
# 401s). There is no way to verify this sha256 without a token this
# implementer does not have — recorded as UNVERIFIED and left disabled per
# the plan; a human with Hub access must fill in the real hash before
# flipping enabled = true. Size (23802932552 bytes) came from the same
# unauthenticated tree API, which does expose sizes for gated repos.

