# Starter model manifest for media-fetch-models (Task 2 of
# docs/superpowers/plans/2026-09-02-media-flake.md).
#
# Every sha256 below was read from the Hugging Face file's own Git-LFS
# pointer (`curl https://huggingface.co/<repo>/raw/main/<path>`, which
# returns the literal `oid sha256:<hash>` line Hugging Face's LFS storage
# is keyed on — not typed or estimated) on 2026-09-02. Never hand-guess a
# hash here: an entry that cannot be verified this way is recorded with
# sha256 = "UNVERIFIED" and enabled = false; media-fetch-models refuses to
# fetch an UNVERIFIED entry even if named explicitly via --only.
#
# `dest` paths are relative to dataDir/models and follow ComfyUI's current
# split-file model folders (checkpoints/, diffusion_models/, text_encoders/,
# vae/) — the folders the native UNETLoader/CLIPLoader/VAELoader and
# CheckpointLoaderSimple nodes read from.

