# The factory's one pinned agent registry (decision 23b): role -> route,
# role/kind/size/class/rung plus FA32's `variant` (the routing table's lookup
# key), the tools the shim advertises, the artifact kind its output must
# satisfy (`schema`, an FA14 kind from tools/factory/seat/factory-artifact.py)
# and its prompt file. tools/factory/seat/factory-registry.py renders the
# .claude/agents/<name>.md shims from these rows and the routing table, and
# `check` refuses a row that does not resolve, a missing prompt, an unknown
# schema or a drifted shim. This file is the only place a role's model is
# named outside docs/ledger/routing.toml; the graph (FA14) names roles, never
# models. FA32: `variant` (default "any") is the free-form discriminator that
# lets the three judge seats share one routing key and resolve to three model
# families; it is passed to route.py as --variant, and a variant no routing
# row carries falls back to the any-variant row, never an error.

[[agent]]
name = "implement"
route = "openrouter"
role = "implement"
kind = "code"
size = "any"
class = "any"
rung = 1
tools = ["Read", "Edit", "Write", "Bash"]
schema = "attempt"
prompt = "tools/factory/seat/README.md"

[[agent]]
name = "review"
route = "openrouter"
role = "review"
kind = "any"
size = "any"
class = "any"
rung = 1
tools = ["Read", "Bash"]
schema = "verdict"
prompt = "tools/factory/seat/README.md"

# FA32: the draft seat. Route moved from openrouter-batch to openrouter -- the
# plan graph's draft and revise nodes are agent nodes now, so the seat job
# goes through the seat@ unit (proxy and CA bundle already on it) and needs no
# lane handed to the runner's environment. Resolves through the plain
# drafting rows route.py keys on docs-spec.
[[agent]]
name = "draft"
route = "openrouter"
role = "implement"
kind = "docs"
size = "any"
class = "docs-spec"
rung = 1
tools = ["Read"]
schema = "attempt"
prompt = "tools/factory/plan/seat-plan.md"

# FA32: the three judge seats, one per variant axis value. Same job, same
# prompt, same schema, same tools -- three model families (never the
# drafter's), keyed only by variant so the routing table names the models.
# Names are positional: judge-fable was a name its model made false.
[[agent]]
name = "judge-a"
route = "openrouter"
role = "review"
kind = "docs"
size = "any"
class = "any"
variant = "a"
rung = 1
tools = ["Read", "Bash"]
schema = "verdict"
prompt = "tools/factory/plan/judge-prompt.md"

[[agent]]
name = "judge-b"
route = "openrouter"
role = "review"
kind = "docs"
size = "any"
class = "any"
variant = "b"
rung = 1
tools = ["Read", "Bash"]
schema = "verdict"
prompt = "tools/factory/plan/judge-prompt.md"

[[agent]]
name = "judge-c"
route = "openrouter"
role = "review"
kind = "docs"
size = "any"
class = "any"
variant = "c"
rung = 1
tools = ["Read", "Bash"]
schema = "verdict"
prompt = "tools/factory/plan/judge-prompt.md"
