# The tvix-aios Cargo workspace (plan 2026-09-22-tvix-aios-step1, OS2). The
# members build from the publish-gate export (pkgs/aiosd/default.nix); the
# fork's crates are path dependencies under ./tvix, which the flake provides
# in every build and which is never a tracked path. Regenerate Cargo.lock
# offline after any dependency change:
#   cp "$(nix build .#aios-lock --print-out-paths --no-link)" Cargo.lock
[workspace]
resolver = "2"
members = ["pkgs/aiosd"]
exclude = ["tvix"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
nix-compat = { path = "tvix/nix-compat", default-features = false }
tvix-eval = { path = "tvix/eval" }
serde = { version = "1.0.209", features = ["derive"] }
serde_json = "1.0"
