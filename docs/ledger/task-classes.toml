# Task classes derived from `touches` (SD2). Each `[[rule]]` maps one `glob`
# (a plain fnmatch pattern; `*` spans `/`, `?` one character, no `[` and no
# `**` semantics, no leading `/` or `..`) to one `class` of the thirteen
# names.
# A file's class is the FIRST rule whose glob matches it; a task's class is the
# class with the most files, a tie going to the class whose rule appears
# earliest. Order is priority. Change rules here, nowhere else.

# FA1: docs-spec and docs-plan-run resolve before the broader docs/superpowers
# and docs/reviews globs, so a specs file or a plan-judgement classifies to its
# named class rather than docs-plan / docs-board.
[[rule]]
class = "docs-spec"
glob = "docs/superpowers/specs/*"

[[rule]]
class = "docs-plan-run"
glob = "docs/reviews/plan-judgements/*"

[[rule]]
class = "nix-module"
glob = "nixosModules/*"

[[rule]]
class = "nix-module"
glob = "hosts/*"

[[rule]]
class = "nix-module"
glob = "lib/*"

[[rule]]
class = "vm-test"
glob = "tests/integration/*"

[[rule]]
class = "nix-check"
glob = "flake.nix"

[[rule]]
class = "nix-check"
glob = "treefmt.toml"

[[rule]]
class = "nix-check"
glob = "pkgs/*/default.nix"

[[rule]]
class = "nix-check"
glob = "pkgs/*/*.nix"

# FA33: the rust class -- goal 2's Rust OS work (pkgs/aiosd, the root Cargo
# manifest and lockfile). `*` spans `/`, so pkgs/aiosd/* matches every nested
# file; the root Cargo.toml and Cargo.lock need their own rows because they
# are not under pkgs/aiosd/.
[[rule]]
class = "rust"
glob = "pkgs/aiosd/*"

[[rule]]
class = "rust"
glob = "Cargo.toml"

[[rule]]
class = "rust"
glob = "Cargo.lock"

