# Rules inventory — every rule from the six sources, one [[rule]] row each.
#
#   id           R-<kebab>, unique
#   text         the rule, verbatim from its source (byte-for-byte, modulo wrap)
#   source       path:line of the rule's live text
#   origin       the date the source file first landed (git log --diff-filter=A)
#   class        invariant | practice | guard | convention | ritual
#   load_bearing whether a check must keep it true (decision 54a)
#   measured     the command run today and its result, or UNMEASURED: <why>
#   check        a check/test name that fails when the rule stops being true, or ""
#   verdict      "" — kept empty for the operator (keep | amend | retire)
#   note         provenance / cross-reference
#
# Verbatim is enforced by `python3 pkgs/evidence/rules.py validate --root . --verbatim`:
# every row whose `source` resolves must have `text` byte-for-byte in the cited file
# (modulo line wrapping). The three CLAUDE.md rules the meta-planning packet measured
# false (jq on PATH; $HOME read-only; the heredoc lesson) carry their re-measurement
# verbatim from docs/research-2026-09-09-meta-planning-packet.md §9.1-9.3.
# [`created` by KN1; completed and made verbatim by KN1b; verdicts left empty]

# ---- docs/brief.md §3 — the six invariants (class invariant) ----

[[rule]]
id = "R-invariant-basket-tmpfs"
text = "Decrypted basket contents exist only for the lifetime of the agent that mounted them, and only in tmpfs."
source = "docs/brief.md:68"
origin = "2026-09-02"
class = "invariant"
load_bearing = true
measured = """UNMEASURED: phase-1 operator acceptance (encrypt/decrypt + tmpfs teardown); tests/run-mount-tests.sh is operator-run, not a named flake check"""
check = ""
verdict = ""
note = "brief §3 invariant 1"

[[rule]]
id = "R-invariant-credential-plaintext"
text = "No agent process holds a provider credential on disk or in its environment in plaintext. Credentials are injected at an egress proxy."
source = "docs/brief.md:70"
origin = "2026-09-02"
class = "invariant"
load_bearing = true
measured = """UNMEASURED: credential injection is configured via Nix (managed settings); no single named flake check asserts 'no plaintext' end to end"""
check = ""
verdict = ""
note = "brief §3 invariant 2"

[[rule]]
id = "R-invariant-egress-chokepoint"
text = "Every byte leaving the machine crosses one chokepoint that can log the request and refuse it."
source = "docs/brief.md:72"
origin = "2026-09-02"
class = "invariant"
load_bearing = true
measured = """UNMEASURED: egress-broker policy is covered by tests/broker (pytest), not a single named flake check"""
check = ""
verdict = ""
note = "brief §3 invariant 3"

[[rule]]
id = "R-invariant-reproducible"
text = "An environment is reproducible from `flake.lock` + `baskets.lock` + one YubiKey. Nothing else. If a step requires imperative setup, it is a bug in the design."
source = "docs/brief.md:74"
origin = "2026-09-02"
class = "invariant"
load_bearing = true
measured = """UNMEASURED: reproducibility is the phase-9 operator acceptance (rebuild node2), not a named flake check"""
check = ""
verdict = ""
note = "brief §3 invariant 4"

[[rule]]
id = "R-invariant-policy-nix"
text = "Policy — which data class may reach which model — is Nix configuration, reviewable in a diff. Not a runtime setting, not a dotfile an agent can edit."
source = "docs/brief.md:76"
origin = "2026-09-02"
class = "invariant"
load_bearing = true
measured = """UNMEASURED: policy reviewability is the phase-3/5 operator acceptance; the eval checks (lane-eval, seat-eval, managed-settings) are the closest named checks"""
check = ""
verdict = ""
note = "brief §3 invariant 5"

[[rule]]
id = "R-invariant-no-promotion"
text = "Agent-authored code (Hermes skills, dsh plugins, OpenClaw automations) is never promoted from the basket it was written in to any other basket without my review."
source = "docs/brief.md:78"
origin = "2026-09-02"
class = "invariant"
load_bearing = true
measured = """UNMEASURED: skill promotion is the phase-7 operator acceptance; no named flake check"""
check = ""
verdict = ""
note = "brief §3 invariant 6"

