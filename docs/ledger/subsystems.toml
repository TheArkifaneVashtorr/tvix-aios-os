# The subsystem manifest (PR1, decision 1a). Eight [[subsystem]] rows name the
# charter's §2 subsystems (decision 2b) and a ninth names `program`. `owns` is a
# set of fnmatch globs over repo-relative tracked paths (`*` spans `/`, no `**`,
# same matcher as task-classes.toml); every tracked path must match exactly one
# row. `plans` is the plan files allowed to define keys under the prefix (the
# EV2 reservation guard reads it). `depends` names other rows and must stay
# acyclic (charter §6's order: patches+payload -> Helm, manifest -> the import
# assertion, rules audit -> the generated rules). `gate` is the review model
# for the subsystem (opus | sonnet; Helm's API carries the opus gate).

[[subsystem]]
name = "Isolation"
prefix = "IS"
area = "isolation"
gate = "opus"
owns = [
  "pkgs/basket/*",
  "pkgs/broker/*",
  "pkgs/lane/*",
  "tools/lane/*",
  "tools/enroll-yubikey.sh",
  "tools/reset-yubikey-piv.sh",
  "tools/orchestrator-guard.sh",
  "keys.toml",
  "keys/recipients.txt",
  "examples/manifest.json",
  "nixosModules/basketStore.nix",
  "nixosModules/egressBroker.nix",
  "nixosModules/modelLane.nix",
  "nixosModules/seatLane.nix",
  "tests/broker/*",
  "tests/lane/*",
  "tests/run-mount-tests.sh",
  "tests/acceptance/phase1.sh",
  "tests/acceptance/phase1-softkey.sh",
  "tests/acceptance/phase2.sh",
  "tests/acceptance/phase3.sh",
  "tests/integration/broker-vm.nix",
  "tests/integration/lane-vm.nix",
  "tests/unit/10-manifest.bats",
  "tests/unit/20-crypto.bats",
  "tests/unit/30-mount.bats",
  "tests/unit/40-lock.bats",
  "tests/unit/91-orchestrator-guard.bats",
  "tests/unit/91-orchestrator-guard-sweep.txt",
  "tests/unit/93-house-guard.bats",
]
plans = [
  "docs/superpowers/plans/2026-09-09-program.md",
  "docs/superpowers/plans/2026-09-11-isolation.md",
]
depends = ["Program", "Platform"]

