# The subsystem manifest (PR1, decision 1a). Eight [[subsystem]] rows name the
# charter's §2 subsystems (decision 2b) and a ninth names `program`. `owns` is a
# set of fnmatch globs over repo-relative tracked paths (`*` spans `/`, no `**`,
# same matcher as task-classes.toml); every tracked path must match exactly one
# row. `plans` is the plan files allowed to define keys under the prefix (the
# EV2 reservation guard reads it). `depends` names other rows and must stay
# acyclic (charter §6's order: patches+payload -> Helm, manifest -> the import
# assertion, rules audit -> the generated rules). `gate` is the review model
# for the subsystem (opus | sonnet; Helm's API carries the opus gate).

