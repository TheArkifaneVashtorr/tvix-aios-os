[[bug]]
id = "BUG-batch-node-drops-error-body"
found = 2026-09-23
symptom = "factory-batch.py's `node` verb -- the synchronous batch wrapper each `plan.toml` graph tool node calls -- submits the batch, then on a non-202 response reads and discards the body: tools/factory/seat/factory-batch.py:455-462 is `status = e.code` / `body = e.read().decode(\"utf-8\", \"replace\")` on the `HTTPError` branch, through `if status != 202: print(broken(f\"batch submit: HTTP {status}\")); return EXIT_OK` -- `body` is bound and never read again. The same file's other submit path, `_submit` for the `submit` subcommand (:117-124), does the opposite on the identical non-202 branch (`sys.stderr.write(body[:200] + \"\\n\")`), which is what tests/unit/95-batch-tool.bats's \"submit exits 2 when the server answers 400\" pins (`bad request` in the output); `node`'s inline copy of the same request/response handling dropped that line, and no bats case exercises `node`'s non-202 path to catch the drift. Measured 2026-09-23 on run wr3 (key WR, node draft, spec docs/superpowers/specs/2026-09-23-world-resource-control-design.md): the draft artifact's only content is `errata: [\"batch submit: HTTP 400\"]`, verdict broken, exit 0 -- no request id, no server message, nothing to tell a malformed request from an auth failure from a wrong model id. The next graph node (judge-pro-a) then failed too (\"no artifact block in the seat's answer\"), so the run was unrecoverable without re-running by hand with prints added."
repro = '''T=$(mktemp -d); export FA20_SUBMIT_STATUS="$T/submit-status" FA20_REQ_LOG="$T/req.log"; printf 'block\n' >"$T/block.md"; printf '{"kind":"input","key":"K","node":"seed","rung":1,"claims":[],"repro":null,"errata":[],"verdict":"ok","inputs":{"block":"%s/block.md"},"scores":null,"wrong_facts":null}' "$T" >"$T/in.json"; python3 tests/unit/fixtures/fa20-batch-server.py --log "$T/req.log" >"$T/port" 2>"$T/err" & FIXPID=$!; for i in $(seq 1 50); do grep -q '^PORT=' "$T/port" 2>/dev/null && break; sleep 0.1; done; PORT=$(sed -n 's/^PORT=//p' "$T/port"); printf '400\n' >"$T/submit-status"; OUT=$(FACTORY_BATCH_BASE="http://127.0.0.1:$PORT" FACTORY_NODE=draft FACTORY_RUN_DIR="$T/run" FACTORY_BATCH_INTERVAL=0 FACTORY_BATCH_TIMEOUT=5 python3 tools/factory/seat/factory-batch.py node --role draft "$T/in.json"); kill "$FIXPID" 2>/dev/null; wait "$FIXPID" 2>/dev/null; echo "$OUT" | grep -q 'bad request' && exit 1; echo "$OUT" | grep -q 'batch submit: HTTP 400' '''
status = "open"
closing_check = "unit"
task = ""
evidence = "tools/factory/seat/factory-batch.py"

[[bug]]
id = "BUG-usage-ingest-logs-source-not-merged"
found = 2026-09-23
symptom = "`ingest_openrouter_usage.ingest()` (pkgs/evidence/ingest_openrouter_usage.py:169-170) writes the merge and discards what it returns: `if rows: evidence.replace_stream(store, \"ledger/openrouter-usage\", rows)` then `return len(rows), refused, torn, counts`. `replace_stream` (pkgs/evidence/evidence.py:134-208) merges the incoming rows into the existing keyed file by `(instance, request_id)` and returns the merged file's own row count (`return len(merged)`, :208) -- the number that actually landed. `main()` prints `len(rows)` (source lines read and validated this run) as \"ingested N rows\", so two source lines sharing a key merge to one stored row while the log still claims 2 landed. Reproduced 2026-09-23: a two-line fixture where both lines carry the same `request_id` prints `ingested 2 rows into ledger/openrouter-usage (0 refused; ...)` while the store holds exactly 1 row afterward. `usage-ingest.timer` (nixosModules/usageIngest.nix, enabled on core at hosts/core/default.nix:123) runs this hourly against the seat broker's real usage.jsonl, so the operational log this stream's own audit trail depends on can never show a merge shrinking -- exactly the case an audit needs to see. The same pattern demonstrated itself the same day on the otel ingest: its log reported 178,040 rows ingested while the stream held 176,204."
repro = '''T=$(mktemp -d); printf '{"ts_epoch":1,"instance":"openrouter","request_id":"00000000000000000000000000000001","streamed":true,"http_status":200,"status":"ok","gen_id":null,"model":"deepseek/deepseek-v4-flash","provider":"DeepInfra","cost_usd":1e-6,"upstream_cost_usd":1e-6,"is_byok":false,"prompt_tokens":1,"completion_tokens":1,"total_tokens":2,"cached_tokens":0,"cache_write_tokens":0,"reasoning_tokens":0}\n{"ts_epoch":2,"instance":"openrouter","request_id":"00000000000000000000000000000001","streamed":true,"http_status":200,"status":"ok","gen_id":null,"model":"deepseek/deepseek-v4-flash","provider":"DeepInfra","cost_usd":2e-6,"upstream_cost_usd":2e-6,"is_byok":false,"prompt_tokens":2,"completion_tokens":2,"total_tokens":4,"cached_tokens":0,"cache_write_tokens":0,"reasoning_tokens":0}\n' >"$T/usage.jsonl"; LOGGED=$(python3 pkgs/evidence/ingest_openrouter_usage.py --store "$T/store" openrouter-usage --root "$T" "$T/usage.jsonl" | grep -oE 'ingested [0-9]+' | grep -oE '[0-9]+'); ACTUAL=$(python3 -c "import sys; sys.path.insert(0,'pkgs/evidence')
import evidence as ev
print(len(ev.read('$T/store','ledger/openrouter-usage')))"); [ "$LOGGED" != "$ACTUAL" ] '''
status = "open"
closing_check = "evidence-unit"
task = ""
evidence = "pkgs/evidence/ingest_openrouter_usage.py"

[[bug]]
id = "BUG-touches-stat-citation-superseded"
found = 2026-09-23
symptom = "Two tracked docs cite the same touches-to-approval-rate finding with different numbers, both still in the tree verbatim: docs/board/log-2026-09.md:7 says \"touches ≤ 2 → 68%, ≥ 5 → 50%, z=2.55, n=278\"; docs/research-2026-09-17-planning-redesign-packet.md:709 says \"77 % at ≤ 2 touches and 53 % at ≥ 5, n = 164, p = 0.001\" (repeated at :529, :573-574, :1105, :1133 in the same doc). The packet's own provenance header (:3-11) discloses that its measurement sections (2 through 9, which include the section carrying this stat) were written by the synthesizer's own arithmetic and never got the house-standard re-run every other cite gets. The two differ in population: the packet counted the full task graph including fix-round keys, the board counted root tasks only. `tasks.py outcomes`'s `_first_gates` join (pkgs/evidence/tasks.py:3007-3033), which landed as PT2 after both citations were already written, is now the one command that can compute this figure from the store; run against the live tree on 2026-09-23 it gives 62/93 = 66.7% at ≤ 2 touches and 51/101 = 50.5% at ≥ 5 -- matching the board's numerators exactly (its n=278 against a live 282 is a day of new gate rows) and diverging from the packet's 77%/53%. The board's number reproduces; the packet's is superseded for this stat. The underlying defect: a headline statistic was typed into prose before any command existed that could check it, then cited onward into a spec and a plan -- the number disagreement is the symptom, not the defect."
repro = '''grep -qF 'touches ≤ 2 → 68%, ≥ 5 → 50%, z=2.55, n=278' docs/board/log-2026-09.md && grep -qF '77 % at ≤ 2 touches and 53 % at ≥ 5, n = 164, p = 0.001' docs/research-2026-09-17-planning-redesign-packet.md'''
status = "open"
closing_check = ""
task = ""
evidence = "docs/research-2026-09-17-planning-redesign-packet.md"

