[[bug]]
id = "BUG-hook-tests-inherit-git-env"
found = 2026-09-24
symptom = "githooks/pre-commit runs `pytest -q tests/evidence/test_judgements.py` (ER1, when docs/reviews is staged) with the hook's environment untouched. On a partial commit (`git commit -- <paths>`, the house recipe for concurrent sessions) git exports GIT_INDEX_FILE as an ABSOLUTE path to the commit's temp index (.git/next-index-<pid>.lock); the tests' `git_env()` helper (tests/evidence/test_judgements.py:99, feeding ~15 tests via make_repo/make_repo_files) passed `**os.environ` into nested `git init/add/commit` in tmp repos, so `git -C <tmp> add .` rewrote the real commit's index with the tmp repo's few files. Incident 2026-09-24: a commit lost 1612 of 1614 tracked files, then a second attempt gave `invalid object ... docs/reviews/plan-judgements/x.md`/`Error building trees` (exit 1); both reset away. An earlier fix (20a2e8b0) stripped GIT_* in one test only (test_judged_ts_normalizes_a_non_utc_git_commit_to_utc_z); git_env() itself still leaked, reproduced in a scratch repo (/tmp/claude-1000/gitleak/, 283 tracked files, git 2.54.0): pre-fix hook + pre-fix test file on `git commit -- <path>` gave `error: invalid object ... for 'docs/reviews/plan-judgements/x.md'` / `Error building trees`, commit exit 1, HEAD tree stuck at 282 files while the index held 283 (dangling tree left behind); the fixed hook (`env -u GIT_INDEX_FILE -u GIT_DIR -u GIT_WORK_TREE -u GIT_OBJECT_DIRECTORY -u GIT_ALTERNATE_OBJECT_DIRECTORIES -u GIT_COMMON_DIR -u GIT_PREFIX -u GIT_NAMESPACE -u GIT_CONFIG_PARAMETERS -u GIT_CONFIG_COUNT pytest ...`) plus the fixed git_env() (`**{k: v for k, v in os.environ.items() if not k.startswith(\"GIT_\")}`) together gave commit exit 0, index and HEAD tree both 283 files. GIT_DIR/GIT_WORK_TREE are not exported in a normal checkout; a plain `git commit -m` gives a relative GIT_INDEX_FILE and is harmless -- only the `-- <paths>` form leaks. Fixed directly in githooks/pre-commit and tests/evidence/test_judgements.py (no typed task; landed alongside this row). Evidence: /tmp/claude-1000/gitleak/review.md (scratch scenarios, not run in the real repo)."
repro = '''! grep -q -- "-u GIT_INDEX_FILE" githooks/pre-commit || ! grep -q 'not k.startswith("GIT_")' tests/evidence/test_judgements.py'''
status = "fixed"
closing_check = ""
task = ""
evidence = "githooks/pre-commit"

