# The typed bug ledger (decision 29a). One [[bug]] row per defect: `id`
# (`BUG-<kebab>`), `found` (date), `symptom`, `repro` (one command), `status`
# (`open` | `fixed` | `closed`), `closing_check` (a check name or ""), `task`
# (the key that fixes it or ""), `evidence` (path). A `fixed` row names the
# `task` that fixed it; a `closed` row names the `closing_check` that passes.
# Validate: python3 pkgs/evidence/bugs.py validate docs/ledger/bugs.toml --root .

