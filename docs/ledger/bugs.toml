id = "BUG-guard-bare-tools-pathspec-over-denial"
found = 2026-09-24
symptom = "The PreToolUse guard refuses a harmless command when a restore/delete-family verb and a bare `tools/` pathspec share one command line: `git checkout -- tools/debug/investigate; git status --short tools/` is denied with 'orchestrator-guard.sh is the operator's; ask for it', while each half alone passes. The guard's own protected entry `tools/orchestrator-guard.sh` rebases onto the project, so any token rooted at `tools/` marks the protected directory as seen, and the delete-family verb elsewhere on the line then denies as if it targeted the guard. An F6-class over-denial (the guard is a pattern matcher, not a syscall filter; docs/concepts/2026-09-22e-guard-bash-pattern-not-syscall.md). Observed live by the DS1 seat (run s38ds3, commit 94fcd288, FACTORY-NOTES and DS1.log item 2), which split the command to proceed. Filed by the operator's word; the main loop cannot run the guard against a payload naming its own path (that is refused too), so the repro below was measured by the seat, not re-run here."
repro = '''printf '{"tool_name":"Bash","tool_input":{"command":"git checkout -- tools/debug/investigate; git status --short tools/"}}' | CLAUDE_PROJECT_DIR="$PWD" bash tools/orchestrator-guard.sh | grep -q '"deny"' '''
status = "open"
closing_check = ""
task = ""
evidence = "tools/orchestrator-guard.sh"

[[bug]]
id = "BUG-guard-python-copy-bypass"
found = 2026-09-24
symptom = "The plan skill's ship step copied the judged draft onto its plan path with `nix develop -c python3 -c \"import shutil; shutil.copy(...)\"` -- a Bash write to a plan path the guard is meant to refuse -- and the PreToolUse guard did not catch it: `tools/orchestrator-guard.sh`'s interpreter-write detection (`os.remove`, `os.unlink`, `unlink(`, `os.rename`, `os.replace`, `shutil.move`, `shutil.rmtree`, `write_text`, `open(...,'w'...)`) has no `shutil.copy` pattern, so a `python3 -c` call naming `shutil.copy` passes through untouched. This wrote docs/superpowers/plans/2026-09-24-retro-fixes.md (401 KB), verified md5-identical to the judged draft, so no content was corrupted -- the finding is that the guard's own enumeration can be walked around by any interpreter write-spelling it does not list. Second measured instance of the class docs/concepts/2026-09-22e-guard-bash-pattern-not-syscall.md names (the guard is a pattern matcher, not a syscall filter); evidence that the strict-user-spaces spec's push-time rules (enforced at git push, not by command-line pattern matching) supersede this guard class. No safe repro against the guard's own path was run (the guard refuses a payload naming itself); the repro below asserts the missing pattern directly."
repro = '''! grep -q 'shutil\.copy' tools/orchestrator-guard.sh'''
status = "open"
closing_check = ""
task = ""
evidence = "tools/orchestrator-guard.sh"

